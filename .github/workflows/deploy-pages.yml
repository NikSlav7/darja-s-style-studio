# Rebuilds and publishes the static site on every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Static build
        run: bunx vite build
        env:
          STATIC_BUILD: "1"
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Add redirect + fallback pages
        run: |
          B="/${{ github.event.repository.name }}/"
          printf '<!doctype html><meta charset="utf-8"><title>Darja</title><meta http-equiv="refresh" content="0;url=%set/"><link rel="canonical" href="%set/"><script>location.replace("%set/"+location.hash)</script>' "$B" "$B" "$B" > dist/client/index.html
          cp dist/client/index.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
