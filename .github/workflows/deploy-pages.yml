# Rebuilds and publishes the static site on every push to main.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Static build
        run: bun run build
        env:
          STATIC_BUILD: "1"
          BASE_PATH: /
          NITRO_PRESET: cloudflare-module
      - name: Add redirect + fallback pages
        env:
          BASE_PATH: /
        run: bun scripts/prepare-github-pages.ts
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
